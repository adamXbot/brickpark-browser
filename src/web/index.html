<!doctype html>
<!-- LEGOLAND portable -- the player page (README.md, "The player page").
     A static launcher: js/app.js installs the game's files into this browser,
     manages the saves and starts the game; js/game.js loads legoland.js only
     when Play is pressed. The developer page with every instrument on it is
     src/browser/index.html; this one has none of them. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1a33">
<meta name="description" content="Play LEGOLAND, LEGO Media's 1999 theme park game, in your browser.">
<title>LEGOLAND</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='22' width='56' height='36' rx='5' fill='%23ffcd05'/%3E%3Crect x='4' y='48' width='56' height='10' rx='4' fill='%23d9a800'/%3E%3Crect x='12' y='12' width='14' height='12' rx='3' fill='%23ffcd05'/%3E%3Crect x='38' y='12' width='14' height='12' rx='3' fill='%23ffcd05'/%3E%3C/svg%3E">
<link rel="stylesheet" href="launcher.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<div class="launcher" id="launcher">
  <header class="topbar">
    <button class="brand" id="brand" type="button" aria-label="LEGOLAND, home">
      <svg class="brand-brick" viewBox="0 0 64 44" aria-hidden="true">
        <rect x="2" y="12" width="60" height="30" rx="5" fill="#ffcd05"/>
        <rect x="2" y="32" width="60" height="10" rx="4" fill="#d9a800"/>
        <rect x="8" y="3" width="14" height="11" rx="3" fill="#ffcd05"/>
        <rect x="25" y="3" width="14" height="11" rx="3" fill="#ffcd05"/>
        <rect x="42" y="3" width="14" height="11" rx="3" fill="#ffcd05"/>
      </svg>
      <span class="brand-text">LEGOLAND</span>
    </button>
    <nav class="nav" id="nav" hidden aria-label="Launcher">
      <button type="button" data-go="menu">Play</button>
      <button type="button" data-go="saves">Saved games</button>
      <button type="button" data-go="data">Game files</button>
      <button type="button" data-go="options">Options</button>
    </nav>
  </header>

  <main id="screen" class="screen-host">
    <section class="screen narrow center">
      <div class="spinner" aria-hidden="true"></div>
      <p class="muted">Getting the park ready…</p>
      <noscript><p>LEGOLAND needs JavaScript to run.</p></noscript>
    </section>
  </main>

  <footer class="footer">
    <p>A fan-made browser version of <em>LEGOLAND</em> (LEGO Media, 1999), rebuilt from the decompiled game. LEGO and LEGOLAND are trademarks of the LEGO Group, which does not sponsor or endorse this project.</p>
  </footer>
</div>

<div class="stage" id="stage" hidden>
  <canvas id="canvas" width="640" height="480" tabindex="0" aria-label="LEGOLAND"></canvas>

  <div class="stage-loading" id="stage-loading">
    <div class="stage-loading-card">
      <svg class="loading-brick" viewBox="0 0 64 44" aria-hidden="true">
        <rect x="2" y="12" width="60" height="30" rx="5" fill="#ffcd05"/>
        <rect x="2" y="32" width="60" height="10" rx="4" fill="#d9a800"/>
        <rect x="8" y="3" width="14" height="11" rx="3" fill="#ffcd05"/>
        <rect x="25" y="3" width="14" height="11" rx="3" fill="#ffcd05"/>
        <rect x="42" y="3" width="14" height="11" rx="3" fill="#ffcd05"/>
      </svg>
      <p class="stage-loading-title" id="stage-loading-title" role="status">Opening the gates…</p>
      <div class="meter indeterminate"><div class="meter-fill" id="stage-loading-bar"></div></div>
      <p class="stage-loading-text" id="stage-loading-text"></p>
    </div>
  </div>

  <div class="stage-bar" id="stage-bar" role="toolbar" aria-label="Game controls">
    <span class="stage-fps" id="stage-fps" hidden></span>
    <button type="button" class="stage-btn" id="stage-sound" title="Sound on" aria-label="Sound" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>
        <path class="sound-on" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/>
        <path class="sound-off" d="M16 9.5l5 5M21 9.5l-5 5"/>
      </svg>
    </button>
    <button type="button" class="stage-btn" id="stage-fullscreen" title="Full screen" aria-label="Full screen" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
      </svg>
    </button>
    <button type="button" class="stage-btn leave" id="stage-leave" title="Leave the park">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9.5 20.5h-4a1.5 1.5 0 0 1-1.5-1.5V5a1.5 1.5 0 0 1 1.5-1.5h4M16 16.5l4.5-4.5L16 7.5M20.5 12H9.5"/>
      </svg>
      <span>Leave</span>
    </button>
  </div>
</div>

<dialog id="dialog" class="dialog"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
