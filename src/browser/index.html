<!doctype html>
<!-- LEGOLAND portable build -- the Emscripten shell page (scopes PORT-B, PORT-B2, PORT-B4).
     Used as emcc's --shell-file, so {{{ SCRIPT }}} is where the generated
     loader is substituted. The canvas id MUST be "canvas": ll_canvas.js looks
     it up by that id when ddraw.c's SetDisplayMode opens the display.

     PORT-B2 added the instrument panel. Four things have to be visible without
     opening devtools, because they are what a run either succeeds or fails on:
       frames   -- is the game presenting at all, and how fast
       modal    -- the last MessageBoxA and the answer the shim gave it; this is
                   how InitSession reports every fatal startup failure
                   (startup.c:136/150/157) and how the CD loop nags
       TRAP      -- a host entry point the closure still stubs. One TRAP line is
                   the whole explanation for a run that stops dead, so it is
                   pulled out of the log and shown in red at the top
       trace     -- ?trace=1, the host call trace (LL_HOST_TRACE, kernel32.c)
       trapcontinue -- ?trapcontinue=1, generated traps print and return (LL_TRAP_CONTINUE)
       beat      -- ?beat=<ms>, the PORT-B8 heartbeat: one stderr line every <ms>
                   (?beat=1 means the 500 ms default), with a 32-entry ring of
                   the last DISTINCT host entry points. The only signal that
                   survives a wedged main thread (LL_HOST_BEAT, user32.c)

     PORT-B4 added the two things a run needs to be steerable and comparable:
       args      ?args=-nointro+-nomusic+WINDEBUG -- the game's command line,
                 echoed in the panel. main.c applies its own default only when
                 the parameter is ABSENT, so an empty ?args= means "no switches
                 at all" and not "the default"
       fps       now rolling AND average-since-the-first-frame. The rolling
                 figure swings while the front end loads sprites; the average is
                 what two runs are comparable on. Both count PRESENTED frames
                 (ll_canvas.js's llFrame), not requestAnimationFrame, because
                 under ASYNCIFY it is the game's own loop that decides when it
                 presents. 33.5 fps in the front end, which is the 28 ms floor
                 FlipPrimary/PresentFlip spin on (~35 Hz) -- i.e. at the ceiling

     PORT-B6 added what a TOOL needs, because driving this page from an agent or
     a test runner is how the front end actually gets walked:
       host calls  a collapsible panel holding the last 300 HOST/[hostwin] trace
                 lines only -- #log holds everything and a traced run buries the
                 six lines you wanted under thousands of Sleep()s
       window.llFrameHash()  FNV-1a over the whole canvas, as a hex string. THE
                 way to prove a click did something: hash, click, hash again.
                 Returns null before the first present.
       window.llSnapshot()   the canvas as a PNG data: URL. A download link or a
                 download button cannot work -- the artifact/preview sandbox
                 makes <a download> and script-driven saves inert for a viewer --
                 so the data URL is the deliverable and the caller saves it.
       window.llStats()      everything the panel shows, as an object: frames,
                 fps, hash, nonBlack, traps, trace length, the last modal.
       window.llTrace(n)     the last n trace lines as an array.

     PORT-B10 added what PLAYING needs, which is more than clicking:
       window.llDrag(x0,y0,x1,y1)  press, move, release in game pixels. The
                 path tool builds a RUN of squares on a drag and a single
                 square on a click, so the tutorial's "link the ride to the
                 main path" cannot be done with llClick at all.
       window.llPark()       the park's own state -- money, people, visitor
                 count, sim frame -- read out of the game's globals. The money
                 readout is a bitmap number; no frame hash can tell you it says
                 1030 rather than 1090.
       window.llAscii(x,y,w,h,thr,light)  a rectangle of the canvas as ASCII
                 ink. The game draws all of its own text; this is how you read
                 it back and catch a glyph that renders wrong.
       window.llCrop(x,y,w,h,scale)  one rectangle, magnified, as a data URL.

       window.llAudio()      (PORT-B11) the sound: the AudioContext's state and
                             rate, voices created, Play calls made and Play
                             calls BLOCKED by the autoplay policy, streamed
                             chunks and bytes, underruns, and a histogram of the
                             formats actually played. Audio cannot be verified by
                             ear from a driver, so it is verified by counting.
       window.llAudioResume()  resume the context by hand. The "sound" cell in
                             the panel does the same thing on click.
       window.llFont()       (PORT-B11) the typeface: the face read out of
                             gamedata/Lego.TTF (upem, glyph count, the
                             usWinAscent/Descent that make the cell, the weight
                             class), and every LOGFONT the game asked for with
                             the cell, ascent, ppem and synthetic-bold it got --
                             plus reportLine63, how wide the tutorial letter's
                             longest line measures against its 460-pixel box.

       window.llSel()        (PORT-M14) what the next ERASER click would take:
                             the edit mode, g_hit_info's type, g_sel_def with
                             its name and footprint, g_sel_bpos (the base cell
                             the removal aims at) and the destroy cursor's
                             origin/rect/validity. Hover, then read.
       window.llCellAt(x,y)  (PORT-M14) one map cell with its OWNER resolved to
                             a class name, its flags split out, and the
                             PathSquare covering it. A player-laid path square
                             is an object cell owned by the path class; a
                             ride's pad interior is the RIDE's own cell wearing
                             a path tile.
       window.llPad(name)    (PORT-M14) every cell of the ride's footprint
                             expanded by one, classified interior vs ring, with
                             what an eraser click on each would find.
-->

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEGOLAND (portable, wasm32)</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #14161a; color: #d7dae0;
         font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { padding: 10px 14px; border-bottom: 1px solid #2a2f37; }
  h1 { margin: 0 0 6px; font-size: 14px; font-weight: 600; letter-spacing: .04em; }
  #status { color: #9aa3b2; }
  #panel { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline;
           margin-top: 8px; }
  .cell { white-space: nowrap; }
  .k { color: #6d7685; }
  .v { color: #e8ebf0; }
  #frames { color: #8fd98f; font-variant-numeric: tabular-nums; }
  #modal { color: #ffd479; max-width: 60ch; overflow: hidden;
           text-overflow: ellipsis; white-space: nowrap; }
  #trap { display: none; margin-top: 8px; padding: 6px 8px; border-radius: 4px;
          background: #3a1418; border: 1px solid #7a2a32; color: #ff9c9c;
          font-weight: 600; white-space: pre-wrap; }
  label { cursor: pointer; }
  #wrap { display: flex; flex-wrap: wrap; gap: 14px; padding: 14px; align-items: flex-start; }
  /* image-rendering: pixelated keeps the 640x480 surface crisp when the
     browser scales it; the game's art is 1:1 pixel work. */
  canvas { background: #000; image-rendering: pixelated;
           border: 1px solid #2a2f37; max-width: 100%; }
  #log { flex: 1 1 320px; min-width: 280px; height: 480px; overflow: auto;
         white-space: pre-wrap; background: #0e1014; border: 1px solid #2a2f37;
         padding: 8px; color: #9aa3b2; }
  .err { color: #ff8e8e; }
  .trapline { color: #ff9c9c; font-weight: 600; }
  /* PORT-B6: the host-call trace, on its own, collapsed by default. */
  #tracepanel { margin-top: 8px; }
  #tracepanel summary { cursor: pointer; color: #6d7685; }
  #tracelines { margin-top: 6px; max-height: 220px; overflow: auto;
                white-space: pre-wrap; background: #0e1014;
                border: 1px solid #2a2f37; padding: 6px 8px; color: #8fb7d9; }
  #hash { color: #b9a6ff; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>LEGOLAND &mdash; portable wasm32 host shim</h1>
  <div id="status">loading the runtime&hellip;</div>
  <div id="panel">
    <span class="cell"><span class="k">frames</span> <span id="frames" class="v">0</span></span>
    <span class="cell"><span class="k">fps</span> <span id="fps" class="v">&mdash;</span></span>
    <span class="cell"><span class="k">modal</span> <span id="modal" class="v">&mdash;</span></span>
    <span class="cell"><span class="k">args</span> <span id="args" class="v">&mdash;</span></span>
    <span class="cell"><span class="k">hash</span> <span id="hash" class="v">&mdash;</span></span>
    <!-- PORT-B11: the sound, and the autoplay gate. A browser will not let a
         page make a noise until the user has interacted with it, and the game's
         own first click is normally that interaction -- but on a screen the
         driver reaches without clicking, or with a keyboard-only walk, the
         context can still be suspended while samples are being "played". This
         cell says which, and is clickable, so there is one affordance instead of
         a silence nobody can explain. -->
    <span class="cell" id="audiocell" title="click to enable sound"><span class="k">sound</span> <span id="audio" class="v">&mdash;</span></span>
    <span class="cell"><span class="k">font</span> <span id="font" class="v">&mdash;</span></span>
    <span class="cell"><label><input type="checkbox" id="trace"> host call trace (<code>?trace=1</code>)</label></span>
  </div>
  <div id="trap"></div>
  <details id="tracepanel">
    <summary>host calls (last <span id="tracecount">0</span>) &mdash; <code>window.llTrace()</code></summary>
    <div id="tracelines"></div>
  </details>
</header>
<div id="wrap">
  <canvas id="canvas" width="640" height="480" tabindex="0"></canvas>
  <div id="log"></div>
</div>
<script>
  var statusEl = document.getElementById('status');
  var logEl = document.getElementById('log');
  var framesEl = document.getElementById('frames');
  var fpsEl = document.getElementById('fps');
  var modalEl = document.getElementById('modal');
  var argsEl = document.getElementById('args');
  var trapEl = document.getElementById('trap');
  var traceEl = document.getElementById('trace');
  var hashEl = document.getElementById('hash');
  var traceLinesEl = document.getElementById('tracelines');
  var traceCountEl = document.getElementById('tracecount');
  var audioEl = document.getElementById('audio');
  var audioCellEl = document.getElementById('audiocell');
  var fontEl = document.getElementById('font');

  var tracing = /[?&]trace=1/.test(location.search);
  var trapcont = /[?&]trapcontinue=1/.test(location.search);   /* PORT-A5: LL_TRAP_CONTINUE */
  // PORT-B8: ?beat=1 -- the heartbeat (user32.c's ll_host_beat). One stderr
  // line every 500 ms naming the last host entry point. It exists for the case
  // this page cannot otherwise report: the game stops reaching a yield, the
  // main thread stops running JS, and llStats/llFrameHash/javascript_tool all
  // time out. stderr still reaches the devtools console (the browser, not the
  // page, delivers it), so the tail of a wedged tab says whether the loop is
  // still calling the host -- see docs/lanes/scope-port-b8.md §2.
  var beatParam = /[?&]beat=([0-9]+)/.exec(location.search);
  var beating = beatParam ? beatParam[1] : null;   // the period in ms; "1" = 500 ms
  traceEl.checked = tracing;

  // ?args=... -- the game's command line (PORT-B4). main() in main.c joins argv
  // into the lpCmdLine it hands WinMain, and startup.c's GameMain parses the
  // switches out of it with FindCommandSwitch, so anything the original
  // accepted works: -nointro, -nomusic, WINDEBUG, -nocd. With the parameter
  // absent main.c applies its own default ("-nointro -nomusic"), which is why
  // this is not filled in with one here: an empty ?args= has to mean "no
  // switches at all" and not "the default".
  //
  // Emscripten reads Module.arguments as argv[1..], so each switch must be its
  // own element; `+` is decoded to a space because a URL-encoded query does
  // that, and empty elements are dropped so `?args=+-nomusic` is not argv[1]="".
  var argsParam = /[?&]args=([^&]*)/.exec(location.search);
  var gameArgs = null;
  if (argsParam) {
    gameArgs = decodeURIComponent(argsParam[1].replace(/\+/g, ' '))
                 .split(/\s+/).filter(function (s) { return s.length > 0; });
  }
  argsEl.textContent = gameArgs ? gameArgs.join(' ') : '-nointro -nomusic (default)';
  // LL_HOST_TRACE is read once, from the environment, the first time a shim
  // function traces (kernel32.c's ll_tracing caches it), so the toggle cannot
  // take effect mid-run: it reloads instead. See docs/lanes/scope-port-b2.md §6.
  traceEl.addEventListener('change', function () {
    var base = location.href.replace(/[?#].*$/, '');
    location.href = traceEl.checked ? base + '?trace=1' : base;
  });

  function logLine(text, cls) {
    var d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = text;
    logEl.appendChild(d);
    // Keep the log bounded: a traced run emits thousands of lines a second and
    // an unbounded log is what makes the tab run out of memory before the game
    // does.
    while (logEl.childNodes.length > 4000) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // A TRAP line is the single most useful thing on the page: it names the host
  // entry point the generated closure still stubs, which is the whole reason a
  // run stops where it stops. gen_link.py's trap helper prints
  // "TRAP <dll> <symbol> ...", so that prefix is the hook.
  var traps = [];
  function noteTrap(text) {
    if (traps.indexOf(text) < 0) {
      traps.push(text);
      trapEl.style.display = 'block';
      trapEl.textContent = traps.length === 1
        ? text
        : traps.length + ' traps:\n' + traps.join('\n');
    }
  }

  // ---- PORT-B6: the host-call trace panel --------------------------------
  //
  // #log holds every line the program prints, which under ?trace=1 is thousands
  // a second; the six lines that say what the host was asked for are then
  // unfindable. ll_host_trace (user32.c) and kernel32.c's own copy both prefix
  // with "HOST ", and ddraw.c's one-off window line with "[hostwin] ", so those
  // two prefixes are the filter. Capped at 300: this is a tail, not a log.
  //
  // PORT-B9: 300 is a tail of the WRONG END when the question is "what did the
  // park loader ask the host for". A7 measured 298 of the last 300 host calls
  // as one-byte ReadFiles, which is precisely a 300-line window that cannot
  // reach back to the CreateFileA that opened the file. Two query parameters
  // fix that without changing the default: `?tracekeep=N` resizes the ring,
  // and `?tracegrep=RE` keeps only the lines matching a regular expression --
  // `?trace=1&tracegrep=CreateFileA` is a hundred lines instead of a hundred
  // thousand, and the ring then spans the whole run.
  var LL_TRACE_KEEP = 300;
  var traceGrep = null;
  (function () {
    var m = /[?&]tracekeep=(\d+)/.exec(location.search);
    if (m) LL_TRACE_KEEP = parseInt(m[1], 10);
    m = /[?&]tracegrep=([^&]+)/.exec(location.search);
    if (m) {
      try { traceGrep = new RegExp(decodeURIComponent(m[1])); }
      catch (e) { console.warn('[page] bad ?tracegrep=:', e); }
    }
  })();
  var traceLog = [];
  function noteTrace(text) {
    if (traceGrep && !traceGrep.test(text)) return;
    traceLog.push(text);
    if (traceLog.length > LL_TRACE_KEEP) traceLog.shift();
    traceCountEl.textContent = traceLog.length;
    // Only paint the DOM when the panel is actually open -- a traced run would
    // otherwise spend its whole budget in layout.
    if (document.getElementById('tracepanel').open) {
      traceLinesEl.textContent = traceLog.join('\n');
      traceLinesEl.scrollTop = traceLinesEl.scrollHeight;
    }
  }
  document.getElementById('tracepanel').addEventListener('toggle', function () {
    if (this.open) {
      traceLinesEl.textContent = traceLog.join('\n');
      traceLinesEl.scrollTop = traceLinesEl.scrollHeight;
    }
  });

  // ---- PORT-B6: the tooling hooks ----------------------------------------
  //
  // An agent or a test runner driving this page needs one question answered --
  // "did that click change the frame?" -- and the answer has to come from the
  // pixels, because every other signal (the frame counter, fps) keeps moving
  // whether or not the game reacted.
  //
  // llFrameHash(): FNV-1a over the canvas's whole RGBA buffer. Deliberately NOT
  // the sampled checksum ll_canvas.js computes for the headless path (every 17th
  // pixel of every 7th row): a front-end screen can differ from the next one in
  // a single 8x8 caption cell, and a sampled hash will say they are identical.
  // The full hash costs one getImageData and about 1.2 M byte reads, which is
  // fine for a tool calling it between clicks and is why nothing calls it per
  // frame.
  //
  // A "download the canvas" BUTTON is not possible for a viewer: the sandbox the
  // page is served in makes <a download> (data: and blob: hrefs included) and
  // every script-driven save inert. So the snapshot is handed back as a data URL
  // and the caller does what it likes with it.
  function canvasPixels() {
    var c = Module.canvas;
    if (!c || !c.width || !c.height) return null;
    try { return c.getContext('2d').getImageData(0, 0, c.width, c.height); }
    catch (e) { return null; }      // tainted or zero-sized: say so, don't throw
  }
  window.llFrameHash = function () {
    var img = canvasPixels();
    if (!img || !framesPresented) return null;
    var d = img.data, h = 0x811c9dc5;
    for (var i = 0; i < d.length; i++)
      h = ((h ^ d[i]) * 0x01000193) >>> 0;
    return '0x' + ('00000000' + h.toString(16)).slice(-8);
  };
  // How much of the frame is not black. "The screen changed" and "the screen is
  // not blank" are different questions and a walk needs both.
  window.llNonBlack = function () {
    var img = canvasPixels();
    if (!img) return null;
    var d = img.data, n = 0;
    for (var i = 0; i < d.length; i += 4)
      if (d[i] | d[i + 1] | d[i + 2]) n++;
    return { nonBlack: n, pixels: d.length / 4,
             percent: +(100 * n / (d.length / 4)).toFixed(1) };
  };
  window.llSnapshot = function (type) {
    var c = Module.canvas;
    if (!c) return null;
    try { return c.toDataURL(type || 'image/png'); } catch (e) { return null; }
  };
  window.llTrace = function (n) {
    return n ? traceLog.slice(-n) : traceLog.slice();
  };
  window.llStats = function () {
    var nb = window.llNonBlack();
    return {
      frames: framesPresented,
      fps: fpsEl.textContent,
      hash: window.llFrameHash(),
      nonBlackPercent: nb ? nb.percent : null,
      traps: traps.slice(),
      traceLines: traceLog.length,
      modal: modalEl.textContent,
      args: argsEl.textContent,
      dead: deadError                     /* PORT-B7: the loop died, and why */
    };
  };

  // ---- PORT-B7: the input driver, and the error the page used to swallow ----
  //
  // Everything below exists because walking this game from a tool is the only
  // way anyone sees a screen past the first one, and PORT-B6's hooks answered
  // "did the frame change" but nothing else. Three things were missing and each
  // one cost this lane real time:
  //
  //  1. A WAY TO CLICK A GAME PIXEL. The game's pointer is RELATIVE
  //     (DIMOUSESTATE lX/lY) and ll_canvas.js differences the absolute position,
  //     so a caller has to know that the first move must be the canvas centre
  //     (where the game's own cursor starts) before any coordinate means
  //     anything. llMove/llClick take GAME pixels and do that arithmetic --
  //     including the CSS scale -- so a walk is a list of (x, y) pairs read out
  //     of the recovered sources rather than a screenshot-measuring exercise.
  //  2. A WAY TO TYPE. The browser-automation "type" verb delivers no key
  //     events to this page at all (PORT-B6 §6 B6), and a `computer key` press
  //     proved just as unreliable in PORT-B7's session -- so the honest way to
  //     drive the keyboard is one dispatched KeyboardEvent per character, with
  //     `code` filled in, HELD long enough for a poll to see it. The game reads
  //     DirectInput state, not WM_CHAR (input2.c's GetInputChar), so a key that
  //     is not down across a frame types nothing.
  //  3. THE PAGE HAD TO SAY WHEN THE GAME DIED. Under ASYNCIFY the game's loop
  //     is resumed from a promise callback, so a RuntimeError inside it -- an
  //     indirect call whose target's type is not the call site's, the class of
  //     defect name_trap.py exists for -- surfaces as an *unhandled promise
  //     rejection* and NOTHING else: the canvas keeps its last frame, the fps
  //     figure keeps its last value, and the page looks alive. PORT-B7 lost an
  //     hour to "the keyboard stopped working" that was really "the module died
  //     0.4 s ago". Now it shows in the trap banner, and llStats().dead says so.
  var deadError = null;
  function noteDeath(stack) {
    if (deadError) return;
    deadError = stack;
    noteTrap('TRAP RUNTIME ' + String(stack).split('\n')[0] +
             '  -- the game loop is dead; see window.llStats().dead');
  }
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    if (r && /RuntimeError/.test(String(r && r.message ? r.message : r) + String(r)))
      noteDeath(r.stack || String(r));
  });
  window.addEventListener('error', function (e) {
    if (e.error && /RuntimeError/.test(String(e.error)))
      noteDeath(e.error.stack || String(e.error));
  });
  window.llDead = function () { return deadError; };

  function llSleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  // GAME pixel -> client coordinate, through the canvas's own rect. This is
  // EXACTLY the arithmetic ll_canvas.js inverts (`x = (clientX - r.left) * LL.w
  // / r.width`), so the deltas the game receives are the ones intended at any
  // CSS scale.
  function llPoint(gx, gy) {
    var c = Module.canvas, r = c.getBoundingClientRect();
    return { c: c, x: r.left + gx * r.width / 640, y: r.top + gy * r.height / 480 };
  }
  function llMouse(type, p, button) {
    p.c.dispatchEvent(new MouseEvent(type, {
      clientX: p.x, clientY: p.y, button: button || 0,
      bubbles: true, cancelable: true }));
  }
  // Move the pointer to a game pixel. The FIRST call of a session should be
  // llMove(320, 240): the game's cursor starts there and ll_canvas.js sets its
  // origin on the first move without emitting one, so that is what puts the two
  // in step. 150 ms is five presented frames at the game's 33 fps floor.
  window.llMove = async function (gx, gy, waitMs) {
    llMouse('mousemove', llPoint(gx, gy));
    await llSleep(waitMs === undefined ? 150 : waitMs);
    return window.llFrameHash();
  };
  window.llClick = async function (gx, gy, button) {
    var p = llPoint(gx, gy);
    llMouse('mousemove', p); await llSleep(150);
    llMouse('mousedown', p, button); await llSleep(150);
    llMouse('mouseup', p, button); await llSleep(500);
    return window.llFrameHash();
  };
  // PORT-B10: llDrag(x0, y0, x1, y1) -- press, move, release, in game pixels.
  //
  // THE PATH TOOL CANNOT BE DRIVEN WITH CLICKS. mapscreen4.c's in-game click
  // handling latches a drag (g_input.flags bit 0x1000) on the press and walks
  // the map squares between the press square and the cursor square until the
  // release, so one path square is a click but a RUN of path is a drag -- and
  // "link the ride to the main path", the tutorial's second objective, is a run
  // of eight or ten. A tool that can only click can build one square at a time
  // and cannot see that the run logic works at all.
  //
  // The intermediate moves are real mousemoves at ~90 ms, which is three frames
  // at the game's 33 fps floor: the game samples DirectInput once a frame, so a
  // drag delivered as two events (down, up) is a drag it never saw move.
  window.llDrag = async function (x0, y0, x1, y1, steps) {
    var i, p0 = llPoint(x0, y0), p1 = llPoint(x1, y1);
    steps = steps || 8;
    llMouse('mousemove', p0); await llSleep(200);
    llMouse('mousedown', p0); await llSleep(200);
    for (i = 1; i <= steps; i++) {
      llMouse('mousemove', llPoint(x0 + (x1 - x0) * i / steps,
                                   y0 + (y1 - y0) * i / steps));
      await llSleep(90);
    }
    llMouse('mouseup', p1); await llSleep(600);
    return window.llFrameHash();
  };

  // PORT-B10: read a rectangle of the canvas AS TEXT. The game's own readouts
  // are bitmap numbers and bitmap words -- the money bar, every caption, every
  // line of the Duty Manager's briefing -- and a driver that can only compare
  // frame hashes can prove that the frame changed but never that it is RIGHT.
  // `light` says whether ink is lighter than the paper (the HUD) or darker

               type: u16(p + 0x20), flags: i32(p + 0x1c),
               inst: el ? i32(p + 0xc4) : 0,
               rect: [i32(p + 0x3c), i32(p + 0x40), i32(p + 0x44), i32(p + 0x48)] };
    }
    // Cursor: origin +0x1404, status +0x140c, error +0x1410, rect +0x1414,
    // style +0x1428, flags +0x1828, next +0x1830, outline count +0x00.
    function cur(p) {
      return { addr: p, count: u16(p), origin: [i32(p + 0x1404), i32(p + 0x1408)],
               status: i32(p + 0x140c), error: i32(p + 0x1410),
               rect: [i32(p + 0x1414), i32(p + 0x1418),
                      i32(p + 0x141c), i32(p + 0x1420)],
               rectNext: i32(p + 0x1424), style: U[p + 0x1428],
               flags: i32(p + 0x1828), next: i32(p + 0x1830),
               // CursorIsValid (0x0045f4b0): status must be POSITIVE.
               valid: i32(p + 0x140c) > 0 };
    }
    var sel = i32(a.g_sel_def);
    return {
      editMode: i32(a.g_edit_state),
      hit: { type: i32(a.g_hit_info), typeHex: '0x' + (i32(a.g_hit_info) >>> 0).toString(16),
             obj: i32(a.g_hit_info + 4), cell: i32(a.g_hit_info + 8) & 0xffff },
      selDef: cls(sel),
      // g_sel_bpos (0x00667c54) is a packed {u8 x, u8 y}: the BASE cell of the
      // object the single-click removal arm aims at.
      selBpos: [U[a.g_sel_bpos], U[a.g_sel_bpos + 1]],
      dragClass: cls(i32(a.g_drag_class)),
      queryExtra: i32(a.g_query_extra),
      destroyCursor: cur(a.g_destroy_cursor),
      editCursor: cur(a.g_edit_cursor),
      input: { mapRef: [i32(a.g_input + 0x24), i32(a.g_input + 0x28)],
               point: [i32(a.g_input + 4), i32(a.g_input + 8)],
               flags: i32(a.g_input) }
    };
  };

  window.llCellAt = function (x, y) {
    var a = window.llAddrs();
    if (!a) return null;
    var I = HEAP32, U = HEAPU8;
    function i32(p) { return I[p >> 2]; }
    function u16(p) { return U[p] | (U[p + 1] << 8); }
    function str(p) { var s = '', c; if (!p) return null;
                      while ((c = U[p++]) && s.length < 128)
                        s += String.fromCharCode(c); return s; }
    var map = i32(a.g_map), rows = i32(a.g_map_rows);
    var mw = u16(map + 0x14), mh = u16(map + 0x16);
    if (!rows || x < 0 || x >= mw || y < 0 || y >= mh) return null;
    var p = i32(rows + y * 4) + x * 0x14;
    var obj = i32(p);                       // Cell +0x00 MapObj*
    var def = obj ? i32(obj + 0x0c) : 0;    // MapObj +0x0c ObjDef*
    var el = def ? i32(def + 0xc4) : 0;
    var flags = u16(p + 0x0c);
    // FindPathSquare: the first square whose INCLUSIVE rect holds the cell.
    var sq = i32(a.g_path_squares), guard = 0, hit = null;
    while (sq && guard++ < 4096) {
      if (x >= i32(sq + 0x08) && x <= i32(sq + 0x10) &&
          y >= i32(sq + 0x0c) && y <= i32(sq + 0x14)) {
        hit = { addr: sq, flags: i32(sq + 0x20),
                reachable: !!(i32(sq + 0x20) & 2) }; break;
      }
      sq = i32(sq);
    }
    return {
      at: [x, y], addr: p,
      obj: obj, def: def,
      owner: def ? str(i32(def + 0x78)) : null,
      ownerElem: el ? str(i32(el)) : null,
      base: [U[p + 4], U[p + 5]],           // Cell +0x04/+0x05 the anchor tile
      tile: u16(p + 8), flags: flags,
      flagsHex: '0x' + flags.toString(16),
      // The three bits this lane turns on: 0x08 basic object, 0x10 path TILE,
      // 0x80 placed footprint. 0x888 is HandleMapClick's "something claims
      // this cell" gate and 0x88 is what promotes the hit to type 0x103.
      isObject: !!(flags & 0x08), isPathTile: !!(flags & 0x10),
      isFootprint: !!(flags & 0x80),
      claimsHit: !!(flags & 0x888), promotesTo103: !!(flags & 0x88),
      pathSquare: hit,
      door: u16(p + 0x12)
    };
  };

  // `llPad(name)` is the census that answers the report: every cell of the
  // first instance's footprint EXPANDED BY ONE (the clearance ring
  // CheckCursorFootprint appends), classified. `interior` rows are the ride's
  // own cells; `ring` rows are what RefreshObjList paved. Each row says what
  // an eraser click there would find.
  window.llPad = function (name) {
    var L = window.llLink(name || 'SPACE TOWER RIDE');
    if (!L || !L.found || !L.insts || !L.insts.length) return null;
    var base = L.insts[0].base, r = L.footprint;
    if (!r) return null;
    var rows = [], x, y;
    for (y = r.top - 1; y <= r.bottom + 1; y++) {
      for (x = r.left - 1; x <= r.right + 1; x++) {
        var c = window.llCellAt(base[0] + x, base[1] + y);
        if (!c) continue;
        var inInterior = (x >= r.left && x <= r.right &&
                          y >= r.top && y <= r.bottom);
        rows.push({ at: c.at, offset: [x, y],
                    where: inInterior ? 'interior' : 'ring',
                    owner: c.owner, flags: c.flagsHex,
                    pathTile: c.isPathTile, footprint: c.isFootprint,
                    pathSquare: !!c.pathSquare,
                    // What HandleMapClick would do with an eraser click here.
                    hitWouldBe: c.promotesTo103 ? '0x103 -> removes ' +
                                  (c.owner || '?') + ' at base ' + c.base
                                : (c.claimsHit ? '0x10b/0x10c work order'
                                               : '0x109/0x10d bare tile') });
      }
    }
    return { name: name || 'SPACE TOWER RIDE', base: base, rect: r, cells: rows };
  };

  // PORT-B9: the RES master directory, walked. `llRes()` lists every bucket
  // with its member count; `llRes("Scripts\\")` lists that bucket's members.
  // res.c's RES_OpenFile splits the path at the last backslash, looks the
  // bucket up with _stricmp and then walks the bucket with stricmp, so a name
  // that does not appear here is a name the game cannot open.
  window.llRes = function (bucket) {
    var a = window.llAddrs();
    if (!a) return null;
    var I = HEAP32, U = HEAPU8;
    function i32(p) { return I[p >> 2]; }
    function str(p) { var s = '', c; if (!p) return null;
                      while ((c = U[p++])) s += String.fromCharCode(c); return s; }
    var out = [], d = i32(a.g_master_dirs), guard = 0;
    while (d && guard++ < 4096) {
      var name = str(i32(d + 8));
      var e = i32(d + 4), n = 0, members = [], g2 = 0;
      while (e && g2++ < 100000) {
        n++;
        if (bucket != null) members.push({ name: str(i32(e + 0x1c)),
                                           size: i32(e + 0x14),
                                           base: i32(e + 0x18) });
        e = i32(e + 4);
      }
      if (bucket == null) out.push({ dir: name, files: n });
      else if (String(name).toLowerCase() === String(bucket).toLowerCase())
        return { dir: name, files: n, members: members };
      d = i32(d);
    }
    if (bucket != null) return { dir: bucket, missing: true,
                                 buckets: out.map(function (b) { return b.dir; }) };
    var vols = [], v = i32(a.g_master_vols), g3 = 0;
    while (v && g3++ < 64) { vols.push(str(v + 8)); v = i32(v); }
    return { buckets: out, volumes: vols };
  };

  // PORT-B9 / A7-1: the level keyword table, read and (optionally) repaired.
  //
  // `movie.c:239` declares the 93-pair table as ONE `const void*`, so the
  // generator is never told that words 1..188 hold pointers: the handler
  // halves resolve through the function-symbol path anyway, but every KEYWORD
  // STRING half keeps the raw x86 VA it had in the image. ParseKeywordSections
  // then does `strcmp(words[0], table[i].keyword)` against a wild address, no
  // keyword ever matches, `MAP "one"` never runs, LoadBaseMap never runs, and
  // the park's 36,864 map cells stay zero -- which is exactly the frame A7-1
  // describes: the HUD draws, the map area does not.
  //
  // llKeywordTable() reports it. llFixKeywordTable() translates each raw VA
  // through the object that contains it and writes the linear address back --
  // the same arithmetic gen_link.py's "interior of a block" rule would have
  // done at build time. This is a DIAGNOSTIC, not a fix: the fix belongs in
  // the generator (or in the declaration), and is PORT-A's.
  function llKwSpans() {
    var a = window.llAddrs();
    // [x86 base, size, linear base] for the two blobs the keyword strings
    // land inside, plus the table itself (one word points into its own tail).
    return [[0x004bb9ec, 992, a.g_str_purge],
            [0x004bbdcc, 696, a.g_str_none],
            [0x004bb6f8, 756, a.g_level_db_sections]];
  }
  window.llKeywordTable = function () {
    var a = window.llAddrs(), I = HEAP32, U = HEAPU8, spans = llKwSpans();
    function str(p) { var s = '', c, n = 0;
                      while ((c = U[p++]) && n++ < 40) s += String.fromCharCode(c);
                      return s; }
    var base = a.g_level_db_sections, out = [], raw = 0, ok = 0, i;
    for (i = 0; i < 93; i++) {
      var w = I[(base + i * 8) >> 2];
      var isRaw = w >= 0x00400000 && w < 0x00900000;
      if (isRaw) raw++; else ok++;
      if (i < 16 || isRaw === false)
        out.push({ i: i, word: '0x' + (w >>> 0).toString(16),
                   raw: isRaw, reads: str(w) });
    }
    return { rawKeywordPointers: raw, resolved: ok, sample: out.slice(0, 12) };
  };
  window.llFixKeywordTable = function () {
    var a = window.llAddrs(), I = HEAP32, spans = llKwSpans();
    var base = a.g_level_db_sections, fixed = 0, unmapped = [], i, j;
    for (i = 0; i < 93; i++) {
      var at = (base + i * 8) >> 2, w = I[at];
      if (!(w >= 0x00400000 && w < 0x00900000)) continue;
      for (j = 0; j < spans.length; j++) {
        if (w >= spans[j][0] && w < spans[j][0] + spans[j][1]) {
          I[at] = spans[j][2] + (w - spans[j][0]);
          fixed++;
          break;
        }
      }
      if (j === spans.length) unmapped.push('0x' + (w >>> 0).toString(16));
    }
    return { fixed: fixed, unmapped: unmapped };
  };

  // fps. llFrame(n) is called by ll_canvas.js once per PRESENTED frame, so this
  // measures what the game actually puts on the canvas, not requestAnimationFrame
  // -- which is the number that matters, because under ASYNCIFY the game's own
  // loop decides when it presents. Both a rolling figure over the last second
  // and the average since the first frame are shown: the rolling one swings
  // wildly while the front end loads sprites, and the average is what a run is
  // comparable on (PORT-B4).
  var t0 = 0, lastFrames = 0, lastT = 0, firstFrame = 0;
  var framesPresented = 0;        // PORT-B6: llStats/llFrameHash read this
  var Module = {
    canvas: document.getElementById('canvas'),
    // argv[1..] for main(). Absent (null) means main.c's own default switches.
    arguments: gameArgs || undefined,
    preRun: [function () { if (tracing) ENV.LL_HOST_TRACE = '1';
                           if (trapcont) ENV.LL_TRAP_CONTINUE = '1';
                           if (beating) ENV.LL_HOST_BEAT = beating; }],
    print: function (t) {
      logLine(t); console.log(t);
      if (/^TRAP\b/.test(t)) noteTrap(t);
    },
    printErr: function (t) {
      // stderr carries the traps, the MessageBox echoes and the HOST trace.
      var trap = /^TRAP\b/.test(t);
      logLine(t, trap ? 'trapline' : 'err');
      console.error(t);
      if (trap) noteTrap(t);
      else if (/^(HOST |\[hostwin\])/.test(t)) noteTrace(t);   // PORT-B6
    },
    setStatus: function (t) { if (t) statusEl.textContent = t; },
    // ll_canvas.js calls these three.
    llStatus: function (t) { statusEl.textContent = t; },
    llFrame: function (n) {
      framesEl.textContent = n;
      framesPresented = n;
      var now = performance.now();
      if (!t0) { t0 = now; lastT = now; lastFrames = n; firstFrame = n; return; }
      if (now - lastT >= 500) {
        var inst = (n - lastFrames) * 1000 / (now - lastT);
        var avg = (n - firstFrame) * 1000 / (now - t0);
        fpsEl.textContent = inst.toFixed(1) + ' (avg ' + avg.toFixed(1) + ')';
        lastT = now; lastFrames = n;
      }
    },
    llMessageBox: function (text) { modalEl.textContent = text; modalEl.title = text; }
  };
  // The canvas needs focus for keydown; ll_canvas.js listens on window, but
  // clicking the page first is what browsers want before they deliver keys.
  window.addEventListener('load', function () { Module.canvas.focus(); });
  Module.canvas.addEventListener('click', function () { Module.canvas.focus(); });

  // PORT-B6: the frame hash in the panel, every 2 s. One full-canvas hash per
  // two seconds is nothing next to a 33 fps RGB565 conversion, and having it on
  // screen is what makes "I clicked and the screen did not change" a reading
  // rather than an impression. Not per frame: see llFrameHash.
  setInterval(function () {
    var h = window.llFrameHash();
    if (h) hashEl.textContent = h;

    // PORT-B11. The sound cell is a reading, not a decoration: "running, 14
    // plays" and "suspended, 14 BLOCKED" look the same on screen otherwise, and
    // the second one is the browser's autoplay policy rather than a bug in the
    // port. Colour-coded, because a suspended context is the one state a tester
    // has to act on.
    if (window.llAudio) {
      var a = window.llAudio();
      var txt = a.state;
      if (a.state === 'none') txt = 'none';
      else txt = a.state + ', ' + a.plays + ' played' +
                 (a.plays_blocked ? ', ' + a.plays_blocked + ' BLOCKED' : '') +
                 (a.stream_chunks ? ', ' + a.stream_chunks + ' stream chunks' : '');
      audioEl.textContent = txt;
      audioEl.style.color = a.state === 'running' ? '#9cffb0'
                          : a.state === 'suspended' ? '#ffd479' : '#6d7685';
      audioCellEl.style.cursor = a.state === 'running' ? 'default' : 'pointer';
      audioCellEl.title = a.state === 'running'
        ? 'Web Audio running at ' + a.rate + ' Hz'
        : 'click to enable sound (the browser blocks audio until you interact)';
    }
    if (window.llFont) {
      var f = window.llFont();
      if (f && f.face)
        fontEl.textContent = 'Lego.TTF, ' + f.fonts.length + ' sizes' +
          (f.fonts.length ? ' (' + f.fonts.map(function (x) { return x.cell; }).join('/') + ')' : '');
      else if (f)
        fontEl.textContent = 'bitmap fallback';
    }
  }, 2000);

  // One click anywhere on the cell, and a capture-phase one on the canvas, both
  // resume the context. ll_audio.c installs its own document-level listeners as
  // well; this is the visible one.
  if (audioCellEl)
    audioCellEl.addEventListener('click', function () {
      if (window.llAudioResume) window.llAudioResume();
    });
</script>
