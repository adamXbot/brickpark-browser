<!doctype html>
<!-- LEGOLAND portable build -- the Emscripten shell page (scopes PORT-B, PORT-B2, PORT-B4).
     Used as emcc's --shell-file, so {{{ SCRIPT }}} is where the generated
     loader is substituted. The canvas id MUST be "canvas": ll_canvas.js looks
     it up by that id when ddraw.c's SetDisplayMode opens the display.

     PORT-B2 added the instrument panel. Four things have to be visible without
     opening devtools, because they are what a run either succeeds or fails on:
       frames   -- is the game presenting at all, and how fast
       modal    -- the last MessageBoxA and the answer the shim gave it; this is
                   how InitSession reports every fatal startup failure
                   (startup.c:136/150/157) and how the CD loop nags
       TRAP      -- a host entry point the closure still stubs. One TRAP line is
                   the whole explanation for a run that stops dead, so it is
                   pulled out of the log and shown in red at the top
       trace     -- ?trace=1, the host call trace (LL_HOST_TRACE, kernel32.c)

     PORT-B4 added the two things a run needs to be steerable and comparable:
       args      ?args=-nointro+-nomusic+WINDEBUG -- the game's command line,
                 echoed in the panel. main.c applies its own default only when
                 the parameter is ABSENT, so an empty ?args= means "no switches
                 at all" and not "the default"
       fps       now rolling AND average-since-the-first-frame. The rolling
                 figure swings while the front end loads sprites; the average is
                 what two runs are comparable on. Both count PRESENTED frames
                 (ll_canvas.js's llFrame), not requestAnimationFrame, because
                 under ASYNCIFY it is the game's own loop that decides when it
                 presents. 33.5 fps in the front end, which is the 28 ms floor
                 FlipPrimary/PresentFlip spin on (~35 Hz) -- i.e. at the ceiling
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LEGOLAND (portable, wasm32)</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #14161a; color: #d7dae0;
         font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { padding: 10px 14px; border-bottom: 1px solid #2a2f37; }
  h1 { margin: 0 0 6px; font-size: 14px; font-weight: 600; letter-spacing: .04em; }
  #status { color: #9aa3b2; }
  #panel { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline;
           margin-top: 8px; }
  .cell { white-space: nowrap; }
  .k { color: #6d7685; }
  .v { color: #e8ebf0; }
  #frames { color: #8fd98f; font-variant-numeric: tabular-nums; }
  #modal { color: #ffd479; max-width: 60ch; overflow: hidden;
           text-overflow: ellipsis; white-space: nowrap; }
  #trap { display: none; margin-top: 8px; padding: 6px 8px; border-radius: 4px;
          background: #3a1418; border: 1px solid #7a2a32; color: #ff9c9c;
          font-weight: 600; white-space: pre-wrap; }
  label { cursor: pointer; }
  #wrap { display: flex; flex-wrap: wrap; gap: 14px; padding: 14px; align-items: flex-start; }
  /* image-rendering: pixelated keeps the 640x480 surface crisp when the
     browser scales it; the game's art is 1:1 pixel work. */
  canvas { background: #000; image-rendering: pixelated;
           border: 1px solid #2a2f37; max-width: 100%; }
  #log { flex: 1 1 320px; min-width: 280px; height: 480px; overflow: auto;
         white-space: pre-wrap; background: #0e1014; border: 1px solid #2a2f37;
         padding: 8px; color: #9aa3b2; }
  .err { color: #ff8e8e; }
  .trapline { color: #ff9c9c; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>LEGOLAND &mdash; portable wasm32 host shim</h1>
  <div id="status">loading the runtime&hellip;</div>
  <div id="panel">
    <span class="cell"><span class="k">frames</span> <span id="frames" class="v">0</span></span>
    <span class="cell"><span class="k">fps</span> <span id="fps" class="v">&mdash;</span></span>
    <span class="cell"><span class="k">modal</span> <span id="modal" class="v">&mdash;</span></span>
    <span class="cell"><span class="k">args</span> <span id="args" class="v">&mdash;</span></span>
    <span class="cell"><label><input type="checkbox" id="trace"> host call trace (<code>?trace=1</code>)</label></span>
  </div>
  <div id="trap"></div>
</header>
<div id="wrap">
  <canvas id="canvas" width="640" height="480" tabindex="0"></canvas>
  <div id="log"></div>
</div>
<script>
  var statusEl = document.getElementById('status');
  var logEl = document.getElementById('log');
  var framesEl = document.getElementById('frames');
  var fpsEl = document.getElementById('fps');
  var modalEl = document.getElementById('modal');
  var argsEl = document.getElementById('args');
  var trapEl = document.getElementById('trap');
  var traceEl = document.getElementById('trace');

  var tracing = /[?&]trace=1/.test(location.search);
  traceEl.checked = tracing;

  // ?args=... -- the game's command line (PORT-B4). main() in main.c joins argv
  // into the lpCmdLine it hands WinMain, and startup.c's GameMain parses the
  // switches out of it with FindCommandSwitch, so anything the original
  // accepted works: -nointro, -nomusic, WINDEBUG, -nocd. With the parameter
  // absent main.c applies its own default ("-nointro -nomusic"), which is why
  // this is not filled in with one here: an empty ?args= has to mean "no
  // switches at all" and not "the default".
  //
  // Emscripten reads Module.arguments as argv[1..], so each switch must be its
  // own element; `+` is decoded to a space because a URL-encoded query does
  // that, and empty elements are dropped so `?args=+-nomusic` is not argv[1]="".
  var argsParam = /[?&]args=([^&]*)/.exec(location.search);
  var gameArgs = null;
  if (argsParam) {
    gameArgs = decodeURIComponent(argsParam[1].replace(/\+/g, ' '))
                 .split(/\s+/).filter(function (s) { return s.length > 0; });
  }
  argsEl.textContent = gameArgs ? gameArgs.join(' ') : '-nointro -nomusic (default)';
  // LL_HOST_TRACE is read once, from the environment, the first time a shim
  // function traces (kernel32.c's ll_tracing caches it), so the toggle cannot
  // take effect mid-run: it reloads instead. See docs/lanes/scope-port-b2.md §6.
  traceEl.addEventListener('change', function () {
    var base = location.href.replace(/[?#].*$/, '');
    location.href = traceEl.checked ? base + '?trace=1' : base;
  });

  function logLine(text, cls) {
    var d = document.createElement('div');
    if (cls) d.className = cls;
    d.textContent = text;
    logEl.appendChild(d);
    // Keep the log bounded: a traced run emits thousands of lines a second and
    // an unbounded log is what makes the tab run out of memory before the game
    // does.
    while (logEl.childNodes.length > 4000) logEl.removeChild(logEl.firstChild);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // A TRAP line is the single most useful thing on the page: it names the host
  // entry point the generated closure still stubs, which is the whole reason a
  // run stops where it stops. gen_link.py's trap helper prints
  // "TRAP <dll> <symbol> ...", so that prefix is the hook.
  var traps = [];
  function noteTrap(text) {
    if (traps.indexOf(text) < 0) {
      traps.push(text);
      trapEl.style.display = 'block';
      trapEl.textContent = traps.length === 1
        ? text
        : traps.length + ' traps:\n' + traps.join('\n');
    }
  }

  // fps. llFrame(n) is called by ll_canvas.js once per PRESENTED frame, so this
  // measures what the game actually puts on the canvas, not requestAnimationFrame
  // -- which is the number that matters, because under ASYNCIFY the game's own
  // loop decides when it presents. Both a rolling figure over the last second
  // and the average since the first frame are shown: the rolling one swings
  // wildly while the front end loads sprites, and the average is what a run is
  // comparable on (PORT-B4).
  var t0 = 0, lastFrames = 0, lastT = 0, firstFrame = 0;
  var Module = {
    canvas: document.getElementById('canvas'),
    // argv[1..] for main(). Absent (null) means main.c's own default switches.
    arguments: gameArgs || undefined,
    preRun: [function () { if (tracing) ENV.LL_HOST_TRACE = '1'; }],
    print: function (t) {
      logLine(t); console.log(t);
      if (/^TRAP\b/.test(t)) noteTrap(t);
    },
    printErr: function (t) {
      // stderr carries the traps, the MessageBox echoes and the HOST trace.
      var trap = /^TRAP\b/.test(t);
      logLine(t, trap ? 'trapline' : 'err');
      console.error(t);
      if (trap) noteTrap(t);
    },
    setStatus: function (t) { if (t) statusEl.textContent = t; },
    // ll_canvas.js calls these three.
    llStatus: function (t) { statusEl.textContent = t; },
    llFrame: function (n) {
      framesEl.textContent = n;
      var now = performance.now();
      if (!t0) { t0 = now; lastT = now; lastFrames = n; firstFrame = n; return; }
      if (now - lastT >= 500) {
        var inst = (n - lastFrames) * 1000 / (now - lastT);
        var avg = (n - firstFrame) * 1000 / (now - t0);
        fpsEl.textContent = inst.toFixed(1) + ' (avg ' + avg.toFixed(1) + ')';
        lastT = now; lastFrames = n;
      }
    },
    llMessageBox: function (text) { modalEl.textContent = text; modalEl.title = text; }
  };
  // The canvas needs focus for keydown; ll_canvas.js listens on window, but
  // clicking the page first is what browsers want before they deliver keys.
  window.addEventListener('load', function () { Module.canvas.focus(); });
  Module.canvas.addEventListener('click', function () { Module.canvas.focus(); });
</script>
{{{ SCRIPT }}}
</body>
</html>
